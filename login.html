<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / Login — Blitzball Labs</title>
<link rel="icon" href="logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/index.css">
<style>
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 20px 40px;position:relative;z-index:5}
  .auth-card{width:100%;max-width:420px;background:var(--card,rgba(18,8,42,.72));border:1px solid var(--border-strong,rgba(139,92,246,.36));
    border-radius:20px;padding:38px 32px;backdrop-filter:blur(16px)}
  .auth-card h1{font-family:'Sora',sans-serif;font-weight:900;font-size:26px;margin:0 0 4px}
  .auth-card .sub{color:var(--text-dim,#b8aed8);font-size:14px;margin-bottom:24px}
  .auth-card label{display:block;font-size:12px;color:var(--text-muted,#7a6f9c);margin:14px 0 5px;font-family:var(--font-mono,monospace)}
  .auth-card input{width:100%;background:#0d0820;border:1px solid var(--border,rgba(139,92,246,.16));border-radius:10px;
    padding:12px 14px;color:var(--text,#f3f0ff);font:inherit}
  .auth-card input:focus{outline:none;border-color:var(--purple,#8b5cf6)}
  .auth-btn{width:100%;margin-top:22px;background:linear-gradient(135deg,var(--purple,#8b5cf6),var(--pink,#f72585));
    color:#fff;border:none;border-radius:100px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
  .auth-btn:disabled{opacity:.6;cursor:not-allowed}
  .auth-foot{margin-top:18px;font-size:13px;color:var(--text-muted,#7a6f9c);text-align:center}
  .auth-foot a{color:var(--purple-light,#a78bfa);cursor:pointer}
  .msg{margin-top:14px;padding:10px 14px;border-radius:10px;font-size:13px;display:none}
  .msg.err{display:block;background:rgba(247,37,133,.12);border:1px solid rgba(247,37,133,.3);color:#ff7ab5}
  .msg.ok{display:block;background:rgba(6,214,160,.12);border:1px solid rgba(6,214,160,.3);color:#10f0b8}
  .lang-tog{position:fixed;top:20px;right:20px;z-index:10;font-family:var(--font-mono,monospace);font-size:12px;
    background:var(--card,rgba(18,8,42,.7));border:1px solid var(--border-strong);color:var(--text);border-radius:100px;padding:7px 14px;cursor:pointer}
  .brand-link{position:fixed;top:18px;left:24px;z-index:10;font-family:'Sora';font-weight:800;color:var(--text);text-decoration:none}
  .brand-link em{font-style:normal;color:var(--purple-light,#a78bfa)}
</style>
</head>
<body>
<div class="bg-aurora"><i class="au au1"></i><i class="au au2"></i><i class="au au3"></i></div>
<div class="bg-grid"></div><div class="bg-noise"></div>
<a href="index.html" class="brand-link">Blitzball<em>Labs</em></a>
<button class="lang-tog" id="langTog">EN</button>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 id="title">登录</h1>
    <div class="sub" id="subtitle">登录查看你购买的序列号</div>

    <div id="name-field" style="display:none">
      <label id="l-name">昵称（可选）</label>
      <input id="f-name" autocomplete="name">
    </div>
    <label id="l-email">邮箱</label>
    <input id="f-email" type="email" autocomplete="email">
    <label id="l-pass">密码</label>
    <input id="f-pass" type="password" autocomplete="current-password">

    <button class="auth-btn" id="submit">登录</button>
    <div class="msg" id="msg"></div>

    <div class="auth-foot">
      <span id="toggle-q">还没有账号？</span> <a id="toggle">注册</a><br>
      <a id="forgot" style="font-size:12px">忘记密码？</a>
    </div>
  </div>
</div>

<script>
(function(){
  var dev=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)||location.protocol==='file:';
  var API=(dev?'http://localhost:8090':'');
  var lang=localStorage.getItem('bb_lang')||'zh'; if(lang!=='zh')lang='en';
  var mode='login'; // or 'register'
  var T={
    zh:{login:"登录",register:"注册",sub_login:"登录查看你购买的序列号",sub_reg:"创建账号管理你的购买与序列号",
      name:"昵称（可选）",email:"邮箱",pass:"密码",toq_login:"还没有账号？",toq_reg:"已有账号？",to_reg:"注册",to_login:"登录",forgot:"忘记密码？",
      need:"请填写邮箱和密码",weakpw:"密码至少 8 位",reg_ok:"注册成功！请查收邮箱完成验证后再登录。",
      bad_cred:"邮箱或密码错误",not_verified:"邮箱还没验证，请查收验证邮件",taken:"该邮箱已注册",bad_email:"邮箱格式不对",
      sent:"如果该邮箱已注册，重置链接已发送。",err:"出错了，稍后再试"},
    en:{login:"Log in",register:"Sign up",sub_login:"Log in to see your license keys",sub_reg:"Create an account to manage purchases & keys",
      name:"Name (optional)",email:"Email",pass:"Password",toq_login:"No account yet?",toq_reg:"Have an account?",to_reg:"Sign up",to_login:"Log in",forgot:"Forgot password?",
      need:"Enter email and password",weakpw:"Password must be 8+ chars",reg_ok:"Registered! Check your email to verify, then log in.",
      bad_cred:"Wrong email or password",not_verified:"Email not verified yet — check your inbox",taken:"Email already registered",bad_email:"Invalid email",
      sent:"If that email exists, a reset link has been sent.",err:"Something went wrong, try later"}
  };
  function t(k){return T[lang][k]||k;}
  function $(id){return document.getElementById(id);}
  function msg(text,ok){var m=$('msg');m.textContent=text;m.className='msg '+(ok?'ok':'err');}
  function render(){
    $('title').textContent=mode==='login'?t('login'):t('register');
    $('subtitle').textContent=mode==='login'?t('sub_login'):t('sub_reg');
    $('l-name').textContent=t('name');$('l-email').textContent=t('email');$('l-pass').textContent=t('pass');
    $('submit').textContent=mode==='login'?t('login'):t('register');
    $('name-field').style.display=mode==='register'?'block':'none';
    $('toggle-q').textContent=mode==='login'?t('toq_login'):t('toq_reg');
    $('toggle').textContent=mode==='login'?t('to_reg'):t('to_login');
    $('forgot').textContent=t('forgot');
    $('forgot').style.display=mode==='login'?'inline':'none';
    $('langTog').textContent=lang==='zh'?'EN':'中';
    document.documentElement.lang=lang;
  }
  $('langTog').onclick=function(){lang=lang==='zh'?'en':'zh';localStorage.setItem('bb_lang',lang);render();};
  $('toggle').onclick=function(){mode=mode==='login'?'register':'login';$('msg').className='msg';render();};
  $('forgot').onclick=function(){location.href='reset.html';};

  $('submit').onclick=async function(){
    var email=$('f-email').value.trim(), pass=$('f-pass').value, name=$('f-name').value.trim();
    if(!email||!pass){msg(t('need'));return;}
    if(mode==='register'&&pass.length<8){msg(t('weakpw'));return;}
    $('submit').disabled=true;
    try{
      var path=mode==='login'?'/api/auth/login':'/api/auth/register';
      var res=await fetch(API+path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:email,password:pass,name:name})});
      var d=await res.json().catch(function(){return{};});
      if(res.ok){
        if(mode==='login'){ location.href='account.html'; }
        else { msg(t('reg_ok'),true); mode='login'; render(); }
      } else {
        var map={BAD_CREDENTIALS:'bad_cred',EMAIL_NOT_VERIFIED:'not_verified',EMAIL_TAKEN:'taken',BAD_EMAIL:'bad_email',WEAK_PASSWORD:'weakpw'};
        msg(t(map[d.error]||'err'));
      }
    }catch(e){ msg(t('err')); }
    $('submit').disabled=false;
  };
  render();
})();
</script>
</body>
</html>
